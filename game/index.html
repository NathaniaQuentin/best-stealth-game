<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salt &amp; Cinder — a lighthouse heist</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d12; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #game { display: block; width: min(100vw, calc(100vh * 1280 / 480)); height: min(100vh, calc(100vw * 480 / 1280)); touch-action: none; background: #171a21; }
  #hud { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start; padding: 10px 14px; pointer-events: none; font: 13px system-ui, sans-serif; color: #e8ecf4; text-shadow: 0 1px 2px #000; }
  #hud .group { display: flex; gap: 10px; align-items: center; }
  #hud .pill { background: rgba(10, 12, 20, 0.72); border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 999px; padding: 5px 12px; }
  #hud-eye { width: 130px; height: 10px; background: rgba(10, 12, 20, 0.72); border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 999px; overflow: hidden; }
  #hud-eye-fill { height: 100%; width: 0%; background: #7fe0d4; transition: width 0.15s linear; }
  #hud .eye-label { font-size: 11px; opacity: 0.85; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="1280" height="480" aria-label="Salt and Cinder: a top-down stealth game. Steal the Fresnel crystal from the lighthouse vault and reach the rowboat unseen."></canvas></div>
<div id="hud">
  <div class="group"><span class="pill" id="hud-objective">Steal the Fresnel crystal from the vault</span></div>
  <div class="group">
    <span class="eye-label">seen?</span>
    <div id="hud-eye" title="Unseen"><div id="hud-eye-fill"></div></div>
    <span class="pill" id="hud-shards">Embers 0/3</span>
    <span class="pill" id="hud-pebbles">Pebbles 5</span>
    <span class="pill" id="hud-time">0s</span>
  </div>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
